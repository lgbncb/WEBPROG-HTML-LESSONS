<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio | Netflix Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">PORTFOLIO</div>
        <nav>
            <ul>
                <li><a href="#about">About Me</a></li>
                <li><a href="#education">Education</a></li>
                <li><a href="#hobbies">Hobbies</a></li>
                <li><a href="#goals">Goals</a></li>
                <li><a href="#experience">IT Experience</a></li>
                <li><a href="#gallery">Gallery</a></li>
                <li><a href="#message" class="btn-red">Message Me</a></li>
            </ul>
        </nav>
    </header>

    <section class="hero">
        <div class="hero-overlay">
            <div class="hero-content">
                <h1>My Digital Story</h1>
                <p>2nd Year Computer Science Student | Tech Enthusiast</p>
                <div class="hero-btns">
                    <a href="#experience" class="play-btn">▶ View Experience</a>
                    <a href="#about" class="info-btn">ⓘ More Info</a>
                </div>
            </div>
        </div>
    </section>

    <main>
        <section id="about" class="row">
            <h2>About Me</h2>
            <div class="card">
                <img src="Images/about.jpg.jpg" alt="Profile Picture">
                <div class="card-text">
                    <p></p>
                </div>
            </div>
        </section>

        <section id="education" class="row">
            <h2>Education</h2>
            <div class="card">
                <img src="images/education.jpeg" alt="Asia Pacific College">
                <div class="card-text">
                    <p></p>
                </div>
            </div>
        </section>

        <section id="hobbies" class="row">
            <h2>Hobbies</h2>
            <div class="card">
                <img src="images/hobbies.jpg.jpg" alt="My Hobbies">
                <div class="card-text">
                    <p></p>
                </div>
            </div>
        </section>

        <section id="goals" class="row">
            <h2>Goals</h2>
            <div class="card">
                <img src="images/goals.jpg.jpg" alt="My 2026 Goals">
                <div class="card-text">
                    <p></p>
                </div>
            </div>
        </section>

        <section id="experience" class="row">
            <h2>IT Experience</h2>
            <div class="card">
                <img src="images/experience.jpg.jpg" alt="Technical Skills">
                <div class="card-text">
                    <p></p>
                </div>
            </div>
        </section>

        <section id="gallery" class="row">
            <h2></h2>
            <div class="gallery-container">
                <img src="images/photo1.jpg" alt="Gallery Photo 1">
                <img src="images/photo2.jpg" alt="Gallery Photo 2">
                <img src="images/photo3.jpg" alt="Gallery Photo 3">
                <img src="images/photo4.jpg" alt="Gallery Photo 4">
            </div>
        </section>

        <section id="message" class="row contact-row">
            <h2>Message Me</h2>
            <form class="contact-form">
                <input type="text" placeholder="Your Name" required>
                <input type="email" placeholder="Your Email" required>
                <textarea placeholder="How can I help you?" rows="5" required></textarea>
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

</body>
</html>
